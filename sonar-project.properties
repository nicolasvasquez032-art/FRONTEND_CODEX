sonar.organization=nicolasvasquez032-art
sonar.projectKey=nicolasvasquez032-art_FRONTEND_CODEX
sonar.projectName=TalentMatch Frontend
sonar.host.url=https://sonarcloud.io

# Source paths and tests relative to repository root
sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Dart / Flutter coverage report
sonar.dart.coverage.reportPath=coverage/lcov.info

# Exclusions (exclude non-Dart platform wrappers and build output)
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,android/**,ios/**,windows/**,linux/**,macos/**,build/**,Dockerfile
