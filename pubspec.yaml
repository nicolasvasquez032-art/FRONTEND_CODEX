name: talentmatch
description: "App móvil de bolsa de empleo con matching semántico por IA."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP
  http: ^1.2.0

  # Persistencia de sesión (JWT token, user_id, profile_id, role)
  shared_preferences: ^2.3.0

  # Gestión de estado
  provider: ^6.1.2

  # Tipografía Inter
  google_fonts: ^6.2.1

  # Sprint F-5 — subir CV (PDF/imagen)
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
