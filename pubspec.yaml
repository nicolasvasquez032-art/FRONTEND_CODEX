name: talentmatch
description: "App móvil de bolsa de empleo con matching semántico por IA."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP
  http: ^1.2.0

  # Persistencia de sesión (JWT token, user_id, profile_id, role)
  shared_preferences: ^2.3.0

  # Gestión de estado
  provider: ^6.1.2

  # Tipografía Inter
  google_fonts: ^6.2.1

  # Sprint F-5 — subir CV (PDF/imagen)
  file_picker: ^13.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shimmer: ^4.0.0
  animate_do: ^5.1.0
  animations: ^3.0.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  confetti: ^0.8.0
  lottie: ^3.6.1
  liquid_pull_to_refresh: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
